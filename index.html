<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>NOVA STORE — لوحة التحكم</title>
<style>
:root{--p:#7c3aed;--p2:#a855f7;--bg:#f5f2fa;--card:#fff;--text:#17121f;--muted:#7d718c;--line:#e7deef;--danger:#dc2626;--ok:#059669;--gold:#b7791f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 0,#e9ddff,#f7f5fb 48%,#eeeaf5)}
.login-card{width:min(480px,100%);background:#fff;border:1px solid var(--line);border-radius:30px;padding:32px;box-shadow:0 25px 90px #4c1d9518}.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900}h1{margin:18px 0 4px}.sub{color:var(--muted);margin:0 0 25px}.label{font-weight:800;font-size:14px;margin:15px 0 7px;display:block}.token{display:flex;gap:7px}.token input{flex:1;min-width:0}.input,.token input,select,textarea{width:100%;border:1px solid #dcd3e9;border-radius:12px;padding:11px 13px;background:#fff;outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #7c3aed18}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:750}.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.secondary{background:#eee9f7;color:#51455f}.danger{background:#fee2e2;color:#991b1b}.success{background:#dff8ef;color:#047857}.full{width:100%;margin-top:18px}.hint{font-size:12px;line-height:1.6;color:var(--muted);margin-top:9px}.notice{margin-top:14px;padding:11px 13px;border-radius:12px;background:#f1ebff;color:#5b21b6;line-height:1.5}
.app{min-height:100vh}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 20px;position:sticky;top:0;z-index:20}.brand{font-weight:900;font-size:20px}.brand i{color:var(--p);font-style:normal}.repo{color:var(--muted);flex:1;font-size:13px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 70px)}aside{background:#fff;border-left:1px solid var(--line);padding:16px 12px}.nav{display:flex;gap:10px;align-items:center;width:100%;padding:11px;border:0;background:transparent;border-radius:12px;text-align:right;margin:3px 0;color:#51475c}.nav.active{background:#eee6ff;color:#6324c6;font-weight:800}.nav:hover{background:#f5f1fb}.side-title{font-size:12px;color:#9a90a4;padding:10px 11px 5px}.main{padding:25px;max-width:1500px;width:100%;margin:auto}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.pagehead h2{margin:0 0 4px}.pagehead p{margin:0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.stat small{color:var(--muted)}.stat b{display:block;font-size:27px;margin-top:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.panel h3{margin:0 0 14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid #eee9f3;text-align:right;vertical-align:middle}.table th{color:#82788d;font-size:12px}.icon{width:42px;height:42px;border-radius:11px;object-fit:cover;background:#eee}.badge{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}.on{background:#dcfce7;color:#166534}.off{background:#f3f4f6;color:#6b7280}.gold{background:#fff4d6;color:#8a5b00}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:7px 9px;font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.check{display:flex;gap:8px;align-items:center;margin:10px 0}.help{font-size:11px;color:var(--muted);line-height:1.55;margin-top:5px}.idbox{display:flex;gap:7px}.idbox input{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace}.empty{padding:35px;text-align:center;color:var(--muted)}.banner-list{display:grid;gap:12px}.banner{display:grid;grid-template-columns:180px 1fr auto;gap:15px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:10px}.banner img{width:180px;height:90px;object-fit:cover;border-radius:11px;background:#eee}.banner h4{margin:0 0 5px}.banner p{margin:0;color:var(--muted);font-size:13px}.modal{position:fixed;inset:0;background:#130c1d88;display:grid;place-items:center;padding:18px;z-index:50}.modalbox{background:#fff;border-radius:22px;width:min(860px,100%);max-height:92vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h3{margin:0}.preview{max-width:100%;max-height:190px;border-radius:14px;margin-top:8px;display:block}.textarea{min-height:140px;resize:vertical}.noticebox{padding:12px;border-radius:14px;background:#faf7ff;border:1px dashed #d9c7f5;color:#60448a;font-size:12px;line-height:1.6}.sectionline{height:1px;background:var(--line);margin:18px 0}.mini{font-size:11px;color:var(--muted)}
@media(max-width:1000px){.cards{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}aside{border-left:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;gap:4px}.side-title{display:none}.nav{white-space:nowrap;width:auto}.repo{display:none}}
@media(max-width:600px){.top{padding:0 12px}.main{padding:14px}.cards,.grid2,.grid3{grid-template-columns:1fr}.banner{grid-template-columns:1fr}.banner img{width:100%;height:150px}.pagehead{align-items:stretch;flex-direction:column}.table{font-size:12px}.hide-mobile{display:none}.modal{padding:8px}.modalbox{padding:16px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const OWNER="GFIOPZ",REPO="NOVA-STORE",BRANCH="main";
const FILES=["apps.json","banners.json","categories.json","sources.json","settings.json"];
const defaults={
 "apps.json":{version:1,updated_at:"",apps:[]},
 "banners.json":{version:1,updated_at:"",banners:[]},
 "categories.json":{version:1,updated_at:"",categories:[]},
 "sources.json":{version:1,updated_at:"",sources:[]},
 "settings.json":{version:1,updated_at:"",store:{name:"NOVA STORE",support_channel:"",latest_apps_limit:10,maintenance:false}}
};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let state={token:localStorage.getItem("nova_token")||"",data:{},sha:{},page:"dashboard",modal:null,notice:"",busy:false,search:""};
function id(prefix){return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)}
function now(){return new Date().toISOString()}
function api(path,opt={}){return fetch("https://api.github.com"+path,{...opt,headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+state.token,"X-GitHub-Api-Version":"2022-11-28",...(opt.headers||{})}}).then(async r=>{let b={};try{b=await r.json()}catch{}if(!r.ok)throw Error(b.message||("GitHub API "+r.status));return b})}
function b64dec(s){const bytes=Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function b64enc(s){const bytes=new TextEncoder().encode(s);let x="";bytes.forEach(b=>x+=String.fromCharCode(b));return btoa(x)}
function notify(x){state.notice=x;render();setTimeout(()=>{if(state.notice===x){state.notice="";render()}},3500)}
async function loadAll(){state.busy=true;render();for(const f of FILES){try{const r=await api(`/repos/${OWNER}/${REPO}/contents/${f}?ref=${BRANCH}`);state.sha[f]=r.sha;state.data[f]=JSON.parse(b64dec(r.content))}catch(e){state.data[f]=structuredClone(defaults[f]);state.sha[f]=null}}state.busy=false;render()}
async function saveFile(file,commit="Update NOVA STORE data"){const obj={...state.data[file],updated_at:now()};const payload={message:commit,content:b64enc(JSON.stringify(obj,null,2)),branch:BRANCH};if(state.sha[file])payload.sha=state.sha[file];const r=await api(`/repos/${OWNER}/${REPO}/contents/${file}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});state.sha[file]=r.content.sha;state.data[file]=obj}
async function saveFiles(list,commit){state.busy=true;render();try{for(const f of list)await saveFile(f,commit);notify("تم الحفظ في GitHub بنجاح.")}catch(e){notify("فشل الحفظ: "+e.message)}finally{state.busy=false;render()}}
function loginView(){return `<main class="login"><section class="login-card"><div class="logo">N</div><h1>NOVA STORE</h1><p class="sub">لوحة التحكم الرئيسية</p><label class="label">GitHub Fine-grained Token</label><div class="token"><input id="token" type="password" placeholder="الصق التوكن هنا" autocomplete="off"><button class="btn secondary" id="show">إظهار</button></div><div class="hint">التوكن يبقى محليًا في هذا المتصفح ويُستخدم مباشرة مع GitHub API. لا تضعه داخل ملفات المشروع.</div><button class="btn primary full" id="login">دخول إلى لوحة التحكم</button>${state.notice?`<div class="notice">${esc(state.notice)}</div>`:""}</section></main>`}
function shell(){const nav=[["dashboard","⌂","الرئيسية"],["apps","▣","التطبيقات"],["banners","▰","البنرات"],["sources","↗","المصادر"],["settings","⚙","الإعدادات"]];return `<div class="app"><header class="top"><div class="brand">NOVA <i>STORE</i></div><div class="repo">${OWNER} / ${REPO}</div>${state.busy?`<span class="badge gold">جاري الحفظ...</span>`:""}<button class="btn secondary" id="logout">خروج ومسح التوكن</button></header><div class="layout"><aside><div class="side-title">الإدارة</div>${nav.map(n=>`<button class="nav ${state.page===n[0]?"active":""}" data-page="${n[0]}">${n[1]} ${n[2]}</button>`).join("")}</aside><main class="main">${pageView()}</main></div>${state.modal?modalView():""}</div>`}
function pageView(){if(state.page==="dashboard")return dashboard();if(state.page==="apps")return appsPage();if(state.page==="banners")return bannersPage();if(state.page==="sources")return sourcesPage();return settingsPage()}
function dashboard(){const apps=state.data["apps.json"]?.apps||[],bans=state.data["banners.json"]?.banners||[],src=state.data["sources.json"]?.sources||[];const activeApps=apps.filter(a=>a.enabled!==false).length;const activeBanners=bans.filter(b=>b.enabled!==false).length;return `<div class="pagehead"><div><h2>الرئيسية</h2><p>تحكم كامل بتطبيقات وبنرات NOVA STORE.</p></div><button class="btn primary" id="refresh">↻ تحديث</button></div><div class="cards"><div class="stat"><small>التطبيقات</small><b>${apps.length}</b><span class="mini">${activeApps} مفعلة</span></div><div class="stat"><small>البنرات</small><b>${bans.length}</b><span class="mini">${activeBanners} مفعلة</span></div><div class="stat"><small>المصادر</small><b>${src.length}</b></div></div><div class="panel" style="margin-top:16px"><h3>ملاحظات مهمة</h3><div class="noticebox">عند إضافة تطبيق جديد يتم توليد ID تلقائيًا. في إضافة البنر لن تحتاج إلى كتابة ID يدويًا؛ اختر التطبيق من القائمة وسيُحفظ app_id تلقائياً. يمكنك أيضاً تحديد نوع الإجراء ونص الزر وإظهار/إخفاء الزر.</div></div>`}
function appsPage(){const apps=state.data["apps.json"]?.apps||[];const q=state.search.toLowerCase();const rows=apps.filter(a=>(String(a.name)+" "+String(a.id)).toLowerCase().includes(q));return `<div class="pagehead"><div><h2>التطبيقات</h2><p>إضافة وإدارة تطبيقات المتجر. يتم إنشاء ID تلقائياً.</p></div><button class="btn primary" id="addApp">+ إضافة تطبيق</button></div><div class="panel"><div class="toolbar"><input class="input" id="search" placeholder="بحث بالاسم أو ID..." value="${esc(state.search)}"><button class="btn secondary" id="enableAllApps">تفعيل الكل</button><button class="btn secondary" id="disableAllApps">إيقاف الكل</button></div>${rows.length?`<table class="table"><thead><tr><th>التطبيق</th><th>ID</th><th>الإصدار</th><th>الحجم</th><th>الظهور</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${rows.map(a=>`<tr><td><div style="display:flex;gap:9px;align-items:center">${a.icon?`<img class="icon" src="${esc(a.icon)}">`:``}<div><b>${esc(a.name)}</b></div></div></td><td><code>${esc(a.id)}</code></td><td>${esc(a.version||"-")}</td><td>${esc(a.size||"-")}</td><td>${a.show_in_home===false?"الرئيسية: لا":"الرئيسية: نعم"}<br>${a.show_in_apps===false?"التطبيقات: لا":"التطبيقات: نعم"}</td><td><span class="badge ${a.enabled!==false?"on":"off"}">${a.enabled!==false?"مفعل":"متوقف"}</span></td><td><div class="actions"><button class="btn secondary small editApp" data-id="${esc(a.id)}">تعديل</button><button class="btn secondary small copyApp" data-id="${esc(a.id)}">نسخ ID</button><button class="btn danger small delApp" data-id="${esc(a.id)}">حذف</button></div></td></tr>`).join("")}</tbody></table>`:`<div class="empty">لا توجد نتائج.</div>`}</div>`}
function bannersPage(){const bs=[...(state.data["banners.json"]?.banners||[])].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));return `<div class="pagehead"><div><h2>البنرات</h2><p>اربط البنر بتطبيق تلقائياً واختر فتح أو انتقال أو رابط خارجي.</p></div><button class="btn primary" id="addBanner">+ إضافة بنر</button></div><div class="panel"><div class="noticebox" style="margin-bottom:14px">إذا اخترت <b>تطبيق</b> سيظهر لك كل تطبيقات لوحة التحكم بالاسم والـID، وبعد الحفظ يتم وضع <b>app_id</b> تلقائياً. نوع الإجراء: <b>فتح التطبيق</b> أو <b>انتقال لصفحة التطبيق</b> أو <b>رابط خارجي</b>. ونص الزر قابل للتخصيص.</div><div class="banner-list">${bs.length?bs.map(b=>{const app=(state.data["apps.json"]?.apps||[]).find(a=>a.id===b.app_id);return `<div class="banner"><img src="${esc(b.image_url||"")}" onerror="this.style.opacity=.25"><div><h4>${esc(b.title||"بدون عنوان")}</h4><p>${esc(b.description||b.subtitle||"")}</p><small>الترتيب: ${b.sort_order||0} • الإجراء: ${esc(actionName(b.action_type))} • التطبيق: ${esc(app?.name||b.app_id||"-")}</small><br><span class="badge ${b.enabled!==false?"on":"off"}">${b.enabled!==false?"مفعل":"متوقف"}</span></div><div class="actions"><button class="btn secondary small editBanner" data-id="${esc(b.id)}">تعديل</button><button class="btn danger small delBanner" data-id="${esc(b.id)}">حذف</button></div></div>`}).join(""):`<div class="empty">لا توجد بنرات.</div>`}</div></div>`}
function actionName(v){return ({none:"بدون",app_open:"فتح التطبيق",app_detail:"انتقال لصفحة التطبيق",external:"رابط خارجي"})[v]||v||"بدون"}
function sourcesPage(){const ss=state.data["sources.json"]?.sources||[];return `<div class="pagehead"><div><h2>المصادر</h2><p>إدارة مصادر repos.json.</p></div><button class="btn primary" id="addSource">+ إضافة مصدر</button></div><div class="panel">${ss.length?ss.map(s=>`<div class="source-card"><div><b>${esc(s.name)}</b><div><code>${esc(s.repo_url||"مصدر داخلي")}</code></div><span class="badge ${s.enabled!==false?"on":"off"}">${s.enabled!==false?"مفعل":"متوقف"}</span></div><div class="actions"><button class="btn secondary small editSource" data-id="${esc(s.id)}">تعديل</button><button class="btn danger small delSource" data-id="${esc(s.id)}">حذف</button></div></div>`).join(""):`<div class="empty">لا توجد مصادر.</div>`}</div>`}
function categoriesPage(){const cs=state.data["categories.json"]?.categories||[];return `<div class="pagehead"><div><h2>التصنيفات</h2><p>إدارة تصنيفات التطبيقات.</p></div><button class="btn primary" id="addCategory">+ إضافة تصنيف</button></div><div class="panel"><table class="table"><thead><tr><th>الاسم</th><th>English</th><th>ID</th><th>الحالة</th><th></th></tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(c.name_ar)}</td><td>${esc(c.name_en)}</td><td>${esc(c.id)}</td><td><span class="badge ${c.enabled!==false?"on":"off"}">${c.enabled!==false?"مفعل":"متوقف"}</span></td><td><div class="actions"><button class="btn secondary small editCat" data-id="${esc(c.id)}">تعديل</button><button class="btn danger small delCat" data-id="${esc(c.id)}">حذف</button></div></td></tr>`).join("")}</tbody></table></div>`}
function settingsPage(){const s=state.data["settings.json"]?.store||{};return `<div class="pagehead"><div><h2>الإعدادات</h2><p>إعدادات المتجر العامة.</p></div><button class="btn primary" id="saveSettings">حفظ الإعدادات</button></div><div class="panel"><div class="grid2"><div class="field"><label>اسم المتجر</label><input id="setName" class="input" value="${esc(s.name||"NOVA STORE")}"></div><div class="field"><label>قناة التحديثات</label><input id="setChannel" class="input" value="${esc(s.support_channel||"")}" placeholder="https://t.me/..."></div><div class="field"><label>عدد آخر التطبيقات</label><input id="setLimit" class="input" type="number" min="1" max="100" value="${s.latest_apps_limit||10}"></div><label class="check"><input id="setMaint" type="checkbox" ${s.maintenance?"checked":""}> وضع الصيانة</label></div></div>`}
function field(label,idName,value="",type="text",placeholder=""){return `<div class="field"><label>${label}</label><input class="input" id="${idName}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`}
function schemeOptions(current){const schemes=[["","تلقائي / بدون Scheme"],["tg://","Telegram — tg://"],["instagram://","Instagram — instagram://"],["youtube://","YouTube — youtube://"],["twitter://","X / Twitter — twitter://"],["whatsapp://","WhatsApp — whatsapp://"],["tiktok://","TikTok — tiktok://"],["discord://","Discord — discord://"],["spotify://","Spotify — spotify://"],["safari://","Safari — safari://"],["__custom__","مخصص..."]];return schemes.map(([v,label])=>`<option value="${esc(v)}" ${current===v?"selected":""}>${esc(label)}</option>`).join("")}
function appForm(a){const isNew=!a.id;const appID=a.id||id("app");const existingScheme=a.url_scheme||"";const known=["","tg://","instagram://","youtube://","twitter://","whatsapp://","tiktok://","discord://","spotify://","safari://"];const schemeKnown=known.includes(existingScheme);return `<div class="noticebox" style="margin-bottom:14px"><b>ID تلقائي:</b> يتم إنشاء معرف فريد للتطبيق تلقائياً، ويمكنك نسخه لربطه بالبنر. <b>لا تستخدم الـID كـURL Scheme.</b></div><div class="grid2">${field("اسم التطبيق","aName",a.name||"","text","مثال: Telegram")}${field("المعرّف ID — تلقائي","aId",appID)}${field("الأيقونة URL","aIcon",a.icon||"","url","https://...")}${field("رابط IPA","aIpa",a.ipa_url||"","url","https://...")}${field("الإصدار","aVer",a.version||"1.0.0")}${field("الحجم","aSize",a.size||"","text","مثال: 45 MB")}</div><div class="field"><label>الوصف</label><textarea id="aDesc" class="input textarea">${esc(a.description||"")}</textarea></div><div class="field"><label>URL Scheme لفتح التطبيق</label><select id="aSchemePreset">${schemeOptions(schemeKnown?existingScheme:"__custom__")}</select><input id="aScheme" class="input" style="margin-top:7px;display:${schemeKnown?"none":"block"}" value="${esc(existingScheme)}" placeholder="مثال: tg://"></div><div class="field"><label>صور التطبيق — رابط لكل صورة في سطر</label><textarea id="aScreens" class="input textarea" style="min-height:100px">${esc((a.screenshots||[]).join("\n"))}</textarea></div><div class="sectionline"></div><div class="grid2"><div><label class="check"><input id="aEnabled" type="checkbox" ${a.enabled!==false?"checked":""}> مفعل</label><label class="check"><input id="aFeatured" type="checkbox" ${a.featured?"checked":""}> مميز</label><label class="check"><input id="aExclusive" type="checkbox" ${a.exclusive!==false?"checked":""}> حصري للمتجر</label></div><div><label class="check"><input id="aHome" type="checkbox" ${a.show_in_home!==false?"checked":""}> يظهر في الرئيسية</label><label class="check"><input id="aApps" type="checkbox" ${a.show_in_apps!==false?"checked":""}> يظهر في التطبيقات</label></div></div><div class="actions"><button class="btn primary" id="saveApp">${isNew?"إضافة التطبيق":"حفظ التعديلات"}</button><button class="btn secondary" id="copyCurrentAppID">نسخ ID</button><button class="btn secondary" id="cancel">إلغاء</button></div>`}
function bannerForm(b){const apps=state.data["apps.json"]?.apps||[];const action=b.action_type||"none";const preset=b.button_title||"عرض";return `<div class="noticebox" style="margin-bottom:14px"><b>ربط آمن:</b> اختر التطبيق بالاسم. اللوحة تحفظ <code>app_id</code> تلقائياً، بينما الـURL Scheme يبقى داخل بيانات التطبيق نفسه.</div><div class="grid2">${field("عنوان البنر","bTitle",b.title||"")}${field("صورة البنر URL","bImage",b.image_url||"","url","https://...")}${field("ترتيب البنر","bOrder",b.sort_order||1,"number")}</div><div class="field"><label>الوصف</label><textarea id="bDesc" class="input textarea">${esc(b.description||"")}</textarea></div><div class="field"><label>التطبيق المرتبط</label><select id="bApp"><option value="">بدون تطبيق</option>${apps.map(a=>`<option value="${esc(a.id)}" ${a.id===b.app_id?"selected":""}>${esc(a.name)} — ID: ${esc(a.id)}${a.url_scheme?` — ${esc(a.url_scheme)}`:""}</option>`).join("")}</select></div><div class="grid2"><div class="field"><label>نوع الإجراء</label><select id="bAction"><option value="none" ${action==="none"?"selected":""}>بدون</option><option value="app_open" ${action==="app_open"?"selected":""}>فتح التطبيق مباشرة</option><option value="app_detail" ${action==="app_detail"?"selected":""}>انتقال إلى صفحة التطبيق</option><option value="external" ${action==="external"?"selected":""}>فتح رابط خارجي</option></select></div><div class="field"><label>نص الزر</label><select id="bPreset"><option value="عرض">عرض</option><option value="فتح">فتح</option><option value="انتقال">انتقال</option><option value="مشاهدة">مشاهدة</option><option value="تحميل">تحميل</option><option value="تثبيت">تثبيت</option><option value="المزيد">المزيد</option><option value="__custom__">مخصص...</option></select><input id="bButton" class="input" style="margin-top:7px" value="${esc(preset)}" placeholder="اكتب النص"></div></div><div class="field"><label>رابط خارجي</label><input id="bUrl" class="input" type="url" value="${esc(b.external_url||"")}" placeholder="https://..."></div><div class="grid2"><label class="check"><input id="bEnabled" type="checkbox" ${b.enabled!==false?"checked":""}> البنر مفعل</label><label class="check"><input id="bShowButton" type="checkbox" ${b.show_button!==false?"checked":""}> إظهار الزر</label><label class="check"><input id="bOpenTap" type="checkbox" ${b.open_on_tap!==false?"checked":""}> الضغط على البنر ينفذ الإجراء</label></div><div class="field"><label>معاينة</label><img id="bPreview" class="preview" src="${esc(b.image_url||"")}" onerror="this.style.display='none'" onload="this.style.display='block'"></div><div class="actions"><button class="btn primary" id="saveBanner">حفظ البنر</button><button class="btn secondary" id="cancel">إلغاء</button></div>`}
function sourceForm(s){return `<div class="grid2">${field("اسم المصدر","sName",s.name||"")}${field("ID","sId",s.id||id("source"))}${field("رابط repos.json","sUrl",s.repo_url||"","url","https://example.com/repos.json")}</div><div class="field"><label>النوع</label><select id="sType"><option value="official" ${s.type==="official"?"selected":""}>رسمي</option><option value="external" ${s.type==="external"?"selected":""}>خارجي</option></select></div><label class="check"><input id="sEnabled" type="checkbox" ${s.enabled!==false?"checked":""}> مفعل</label><label class="check"><input id="sShow" type="checkbox" ${s.show_in_store!==false?"checked":""}> يظهر في المتجر</label><div class="actions"><button class="btn primary" id="saveSource">حفظ</button><button class="btn secondary" id="cancel">إلغاء</button></div>`}
function catForm(c){return `<div class="grid2">${field("الاسم العربي","cAr",c.name_ar||"")}${field("الاسم الإنكليزي","cEn",c.name_en||"")}${field("ID","cId",c.id||id("cat"))}${field("أيقونة SF Symbol","cIcon",c.icon||"square.grid.2x2.fill")}</div><label class="check"><input id="cEnabled" type="checkbox" ${c.enabled!==false?"checked":""}> مفعل</label><div class="actions"><button class="btn primary" id="saveCat">حفظ</button><button class="btn secondary" id="cancel">إلغاء</button></div>`}
function modalView(){let title="",body="";if(state.modal.type==="app"){const a=state.modal.item||{};title=a.id?"تعديل تطبيق":"إضافة تطبيق";body=appForm(a)}if(state.modal.type==="banner"){const b=state.modal.item||{};title=b.id?"تعديل بنر":"إضافة بنر";body=bannerForm(b)}if(state.modal.type==="source"){const s=state.modal.item||{};title=s.id?"تعديل مصدر":"إضافة مصدر";body=sourceForm(s)}if(state.modal.type==="category"){const c=state.modal.item||{};title=c.id?"تعديل تصنيف":"إضافة تصنيف";body=catForm(c)}return `<div class="modal"><section class="modalbox"><div class="modalhead"><h3>${title}</h3><button class="btn secondary" id="closeModal">إغلاق</button></div>${body}</section></div>`}
function val(idName){return $("#"+idName)?.value?.trim()||""}
function currentItem(type){const map={app:["apps.json","apps"],banner:["banners.json","banners"],source:["sources.json","sources"],category:["categories.json","categories"]};const [f,k]=map[type];return {f,k,arr:state.data[f][k]||[]}}
function openModal(type,item={}){state.modal={type,item};render()}
function closeModal(){state.modal=null;render()}
async function commit(type,item){const {f,k,arr}=currentItem(type),idx=arr.findIndex(x=>x.id===item.id);if(idx>=0)arr[idx]=item;else arr.push(item);state.data[f][k]=arr;state.modal=null;render();await saveFiles([f],`Manage ${type} in NOVA STORE`)}
function render(){document.getElementById("root").innerHTML=state.token?shell():loginView();bind()}
function bind(){
 $("#show")?.addEventListener("click",()=>{const x=$("#token");x.type=x.type==="password"?"text":"password";$("#show").textContent=x.type==="password"?"إظهار":"إخفاء"});
 $("#login")?.addEventListener("click",async()=>{const t=$("#token").value.trim();if(!t)return notify("الصق التوكن أولاً.");state.token=t;state.busy=true;render();try{await api("/user");localStorage.setItem("nova_token",t);await loadAll();notify("تم الاتصال بـ GitHub.")}catch(e){state.token="";state.busy=false;notify("فشل الاتصال: "+e.message)}});
 $("#logout")?.addEventListener("click",()=>{localStorage.removeItem("nova_token");state.token="";state.data={};render()});
 document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.search="";render()});
 $("#refresh")?.addEventListener("click",loadAll);$("#search")?.addEventListener("input",e=>{state.search=e.target.value;render();$("#search")?.focus()});
 $("#addApp")?.addEventListener("click",()=>openModal("app"));document.querySelectorAll(".editApp").forEach(b=>b.onclick=()=>openModal("app",(state.data["apps.json"].apps||[]).find(x=>x.id===b.dataset.id)));document.querySelectorAll(".delApp").forEach(b=>b.onclick=()=>del("apps.json","apps",b.dataset.id));
 $("#enableAllApps")?.addEventListener("click",()=>bulkApps(true));$("#disableAllApps")?.addEventListener("click",()=>bulkApps(false));
 $("#addBanner")?.addEventListener("click",()=>openModal("banner"));document.querySelectorAll(".editBanner").forEach(b=>b.onclick=()=>openModal("banner",(state.data["banners.json"].banners||[]).find(x=>x.id===b.dataset.id)));document.querySelectorAll(".delBanner").forEach(b=>b.onclick=()=>del("banners.json","banners",b.dataset.id));
 $("#addSource")?.addEventListener("click",()=>openModal("source"));document.querySelectorAll(".editSource").forEach(b=>b.onclick=()=>openModal("source",(state.data["sources.json"].sources||[]).find(x=>x.id===b.dataset.id)));document.querySelectorAll(".delSource").forEach(b=>b.onclick=()=>del("sources.json","sources",b.dataset.id));
 $("#addCategory")?.addEventListener("click",()=>openModal("category"));document.querySelectorAll(".editCat").forEach(b=>b.onclick=()=>openModal("category",(state.data["categories.json"].categories||[]).find(x=>x.id===b.dataset.id)));document.querySelectorAll(".delCat").forEach(b=>b.onclick=()=>del("categories.json","categories",b.dataset.id));
 $("#closeModal")?.addEventListener("click",closeModal);$("#cancel")?.addEventListener("click",closeModal);
 $("#copyCurrentAppID")?.addEventListener("click",()=>navigator.clipboard?.writeText(val("aId")));$("#copyCurrentAppID")?.addEventListener("click",()=>notify("تم نسخ ID التطبيق."));
 $("#saveApp")?.addEventListener("click",()=>{const old=state.modal.item||{},newID=val("aId")||id("app"),preset=$("#aSchemePreset")?.value||"",scheme=preset==="__custom__"?val("aScheme"):preset;commit("app",{id:newID,name:val("aName"),developer_name:old.developer_name||"",subtitle:old.subtitle||"",description:val("aDesc"),icon:val("aIcon"),version:val("aVer"),size:val("aSize"),category_id:old.category_id||"other",source_id:old.source_id||"nova-store",source_type:old.source_type||"official",ipa_url:val("aIpa"),url_scheme:scheme,badge:old.badge||"",tags:old.tags||[],sort_order:old.sort_order||0,min_ios:old.min_ios||"",screenshots:val("aScreens").split(/\n+/).map(x=>x.trim()).filter(Boolean),featured:$("#aFeatured").checked,exclusive:$("#aExclusive").checked,show_in_home:$("#aHome").checked,show_in_apps:$("#aApps").checked,enabled:$("#aEnabled").checked,created_at:old.created_at||now(),updated_at:now()})});
 $("#aSchemePreset")?.addEventListener("change",e=>{const custom=e.target.value==="__custom__";const input=$("#aScheme");if(input){input.style.display=custom?"block":"none";if(!custom)input.value=e.target.value;}});$("#bImage")?.addEventListener("input",()=>{const p=$("#bPreview");p.src=val("bImage");p.style.display="block"});$("#bPreset")?.addEventListener("change",e=>{if(e.target.value!=="__custom__")$("#bButton").value=e.target.value});
 $("#saveBanner")?.addEventListener("click",()=>commit("banner",{id:state.modal.item.id||id("banner"),image_url:val("bImage"),title:val("bTitle"),subtitle:val("bSub"),description:val("bDesc"),action_type:val("bAction"),app_id:val("bApp")||null,external_url:val("bUrl"),button_title:val("bButton")||"عرض",sort_order:Number(val("bOrder"))||1,enabled:$("#bEnabled").checked,show_button:$("#bShowButton").checked,open_on_tap:$("#bOpenTap").checked}));
 $("#saveSource")?.addEventListener("click",()=>commit("source",{id:val("sId"),name:val("sName"),repo_url:val("sUrl"),type:val("sType"),enabled:$("#sEnabled").checked,show_in_store:$("#sShow").checked}));
 $("#saveCat")?.addEventListener("click",()=>commit("category",{id:val("cId"),name_ar:val("cAr"),name_en:val("cEn"),icon:val("cIcon"),enabled:$("#cEnabled").checked}));
 $("#saveSettings")?.addEventListener("click",async()=>{state.data["settings.json"].store={...state.data["settings.json"].store,name:val("setName"),support_channel:val("setChannel"),latest_apps_limit:Number(val("setLimit"))||10,maintenance:$("#setMaint").checked};await saveFiles(["settings.json"],"Update NOVA STORE settings")});
}
async function bulkApps(enabled){const apps=state.data["apps.json"]?.apps||[];state.data["apps.json"].apps=apps.map(a=>({...a,enabled,updated_at:now()}));await saveFiles(["apps.json"],enabled?"Enable all NOVA apps":"Disable all NOVA apps")}
async function del(file,key,which){if(!confirm("متأكد تريد حذف هذا العنصر؟"))return;state.data[file][key]=(state.data[file][key]||[]).filter(x=>x.id!==which);await saveFiles([file],"Delete item from NOVA STORE")}
render();
</script>
</body>
</html>
