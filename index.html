<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>NOVA STORE — لوحة التحكم</title>
<style>
:root{--p:#7c3aed;--p2:#a855f7;--bg:#f5f2fa;--card:#fff;--text:#17121f;--muted:#7d718c;--line:#e7deef;--danger:#dc2626;--ok:#059669;--gold:#b7791f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 0,#e9ddff,#f7f5fb 48%,#eeeaf5)}
.login-card{width:min(480px,100%);background:#fff;border:1px solid var(--line);border-radius:30px;padding:32px;box-shadow:0 25px 90px #4c1d9518}.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900}h1{margin:18px 0 4px}.sub{color:var(--muted);margin:0 0 25px}.label{font-weight:800;font-size:14px;margin:15px 0 7px;display:block}.token{display:flex;gap:7px}.token input{flex:1;min-width:0}.input,.token input,select,textarea{width:100%;border:1px solid #dcd3e9;border-radius:12px;padding:11px 13px;background:#fff;outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #7c3aed18}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:750}.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.secondary{background:#eee9f7;color:#51455f}.danger{background:#fee2e2;color:#991b1b}.success{background:#dff8ef;color:#047857}.full{width:100%;margin-top:18px}.hint{font-size:12px;line-height:1.6;color:var(--muted);margin-top:9px}.notice{margin-top:14px;padding:11px 13px;border-radius:12px;background:#f1ebff;color:#5b21b6;line-height:1.5}
.app{min-height:100vh}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 20px;position:sticky;top:0;z-index:20}.brand{font-weight:900;font-size:20px}.brand i{color:var(--p);font-style:normal}.repo{color:var(--muted);flex:1;font-size:13px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 70px)}aside{background:#fff;border-left:1px solid var(--line);padding:16px 12px}.nav{display:flex;gap:10px;align-items:center;width:100%;padding:11px;border:0;background:transparent;border-radius:12px;text-align:right;margin:3px 0;color:#51475c}.nav.active{background:#eee6ff;color:#6324c6;font-weight:800}.nav:hover{background:#f5f1fb}.side-title{font-size:12px;color:#9a90a4;padding:10px 11px 5px}.main{padding:25px;max-width:1500px;width:100%;margin:auto}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.pagehead h2{margin:0 0 4px}.pagehead p{margin:0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.stat small{color:var(--muted)}.stat b{display:block;font-size:27px;margin-top:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.panel h3{margin:0 0 14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid #eee9f3;text-align:right;vertical-align:middle}.table th{color:#82788d;font-size:12px}.icon{width:42px;height:42px;border-radius:11px;object-fit:cover;background:#eee}.badge{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}.on{background:#dcfce7;color:#166534}.off{background:#f3f4f6;color:#6b7280}.gold{background:#fff4d6;color:#8a5b00}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:7px 9px;font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.check{display:flex;gap:8px;align-items:center;margin:10px 0}.help{font-size:11px;color:var(--muted);line-height:1.55;margin-top:5px}.idbox{display:flex;gap:7px}.idbox input{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace}.empty{padding:35px;text-align:center;color:var(--muted)}.banner-list{display:grid;gap:12px}.banner{display:grid;grid-template-columns:180px 1fr auto;gap:15px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:10px}.banner img{width:180px;height:90px;object-fit:cover;border-radius:11px;background:#eee}.banner h4{margin:0 0 5px}.banner p{margin:0;color:var(--muted);font-size:13px}.modal{position:fixed;inset:0;background:#130c1d88;display:grid;place-items:center;padding:18px;z-index:50}.modalbox{background:#fff;border-radius:22px;width:min(860px,100%);max-height:92vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h3{margin:0}.preview{max-width:100%;max-height:190px;border-radius:14px;margin-top:8px;display:block}.textarea{min-height:140px;resize:vertical}.noticebox{padding:12px;border-radius:14px;background:#faf7ff;border:1px dashed #d9c7f5;color:#60448a;font-size:12px;line-height:1.6}.sectionline{height:1px;background:var(--line);margin:18px 0}.mini{font-size:11px;color:var(--muted)}
@media(max-width:1000px){.cards{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}aside{border-left:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;gap:4px}.side-title{display:none}.nav{white-space:nowrap;width:auto}.repo{display:none}}
@media(max-width:600px){.top{padding:0 12px}.main{padding:14px}.cards,.grid2,.grid3{grid-template-columns:1fr}.banner{grid-template-columns:1fr}.banner img{width:100%;height:150px}.pagehead{align-items:stretch;flex-direction:column}.table{font-size:12px}.hide-mobile{display:none}.modal{padding:8px}.modalbox{padding:16px}}
html,body{overflow-x:hidden!important;width:100%;max-width:100vw}.app{overflow-x:hidden;max-width:100vw}.layout{min-width:0;width:100%}.main{min-width:0;width:100%;overflow:hidden}.panel{min-width:0;max-width:100%;overflow-x:auto;overflow-y:visible}.actions{max-width:100%}.modalbox{max-width:calc(100vw - 16px);overflow-x:hidden}@media(max-width:600px){.main{padding:12px}.panel{padding:14px}.table{min-width:720px}.grid2,.grid3{min-width:0}.modal{padding:8px}.modalbox{width:100%;max-height:90vh;overflow:auto}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const OWNER="GFIOPZ",REPO="NOVA-STORE",BRANCH="main";
const FILES=["apps.json","banners.json","categories.json","sources.json","settings.json","vip.json"];
const defaults={
 "apps.json":{version:1,updated_at:"",apps:[]},
 "banners.json":{version:1,updated_at:"",banners:[]},
 "categories.json":{version:1,updated_at:"",categories:[]},
 "sources.json":{version:1,updated_at:"",sources:[]},
 "settings.json":{version:1,updated_at:"",store:{name:"NOVA STORE",support_channel:"",latest_apps_limit:10,maintenance:false}},"vip.json":{version:1,updated_at:"",accounts:[]}
};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let state={token:localStorage.getItem("nova_token")||"",data:{},sha:{},page:"dashboard",modal:null,notice:"",busy:false,search:""};
function id(prefix){return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)}
function now(){return new Date().toISOString()}
function api(path,opt={}){return fetch("https://api.github.com"+path,{...opt,headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+state.token,"X-GitHub-Api-Version":"2022-11-28",...(opt.headers||{})}}).then(async r=>{let b={};try{b=await r.json()}catch{}if(!r.ok)throw Error(b.message||("GitHub API "+r.status));return b})}
function b64dec(s){const bytes=Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function b64enc(s){const bytes=new TextEncoder().encode(s);let x="";bytes.forEach(b=>x+=String.fromCharCode(b));return btoa(x)}
function notify(x){state.notice=x;render();setTimeout(()=>{if(state.notice===x){state.notice="";render()}},3500)}
async function loadAll(){state.busy=true;render();for(const f of FILES){try{const r=await api(`/repos/${OWNER}/${REPO}/contents/${f}?ref=${BRANCH}`);state.sha[f]=r.sha;state.data[f]=JSON.parse(b64dec(r.content))}catch(e){state.data[f]=structuredClone(defaults[f]);state.sha[f]=null}}state.busy=false;render()}
async function saveFile(file,commit="Update NOVA STORE data"){const obj={...state.data[file],updated_at:now()};const payload={message:commit,content:b64enc(JSON.stringify(obj,null,2)),branch:BRANCH};if(state.sha[file])payload.sha=state.sha[file];const r=await api(`/repos/${OWNER}/${REPO}/contents/${file}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});state.sha[file]=r.content.sha;state.data[file]=obj}
async function saveFiles(list,commit){state.busy=true;render();try{for(const f of list)await saveFile(f,commit);notify("تم الحفظ في GitHub بنجاح.")}catch(e){notify("فشل الحفظ: "+e.message)}finally{state.busy=false;render()}}
function loginView(){return `<main class="login"><section class="login-card"><div class="logo">N</div><h1>NOVA STORE</h1><p class="sub">لوحة التحكم الرئيسية</p><label class="label">GitHub Fine-grained Token</label><div class="token"><input id="token" type="password" placeholder="الصق التوكن هنا" autocomplete="off"><button class="btn secondary" id="show">إظهار</button></div><div class="hint">التوكن يبقى محليًا في هذا المتصفح ويُستخدم مباشرة مع GitHub API. لا تضعه داخل ملفات المشروع.</div><button class="btn primary full" id="login">دخول إلى لوحة التحكم</button>${state.notice?`<div class="notice">${esc(state.notice)}</div>`:""}</section></main>`}
function shell(){const nav=[["dashboard","⌂","الرئيسية"],["apps","▣","التطبيقات"],["banners","▰","البنرات"],["sources","↗","المصادر"],["categories","◈","التصنيفات"],["settings","⚙","الإعدادات"],["vip","♛","VIP المشتركين"]];return `<div class="app"><header class="top"><div class="brand">NOVA <i>STORE</i></div><div class="repo">${OWNER} / ${REPO}</div>${state.busy?`<span class="badge gold">جاري الحفظ...</span>`:""}<button class="btn secondary" id="logout">خروج ومسح التوكن</button></header><div class="layout"><aside><div class="side-title">الإدارة</div>${nav.map(n=>`<button class="nav ${state.page===n[0]?"active":""}" data-page="${n[0]}">${n[1]} ${n[2]}</button>`).join("")}</aside><main class="main">${pageView()}</main></div>${state.modal?modalView():""}</div>`}
function pageView(){if(state.page==="dashboard")return dashboard();if(state.page==="apps")return appsPage();if(state.page==="banners")return bannersPage();if(state.page==="sources")return sourcesPage();if(state.page==="categories")return categoriesPage();if(state.page==="vip")return vipPage();return settingsPage()}
function dashboard(){const apps=state.data["apps.json"]?.apps||[],bans=state.data["banners.json"]?.banners||[],src=state.data["sources.json"]?.sources||[],cats=state.data["categories.json"]?.categories||[];const activeApps=apps.filter(a=>a.enabled!==false).length;const activeBanners=bans.filter(b=>b.enabled!==false).length;return `<div class="pagehead"><div><h2>الرئيسية</h2><p>تحكم كامل بتطبيقات وبنرات NOVA STORE.</p></div><button class="btn primary" id="refresh">↻ تحديث</button></div><div class="cards"><div class="stat"><small>التطبيقات</small><b>${apps.length}</b><span class="mini">${activeApps} مفعلة</span></div><div class="stat"><small>البنرات</small><b>${bans.length}</b><span class="mini">${activeBanners} مفعلة</span></div><div class="stat"><small>المصادر</small><b>${src.length}</b></div><div class="stat"><small>التصنيفات</small><b>${cats.length}</b></div><div class="stat"><small>مشتركو VIP</small><b>${(state.data["vip.json"]?.accounts||[]).length}</b></div></div><div class="panel" style="margin-top:16px"><h3>ملاحظات مهمة</h3><div class="noticebox">عند إضافة تطبيق جديد يتم توليد ID تلقائيًا. في إضافة البنر لن تحتاج إلى كتابة ID يدويًا؛ اختر التطبيق من القائمة وسيُحفظ app_id تلقائياً. يمكنك أيضاً تحديد نوع الإجراء ونص الزر وإظهار/إخفاء الزر.</div></div>`}
function appsPage(){const apps=state.data["apps.json"]?.apps||[];const q=state.search.toLowerCase();const rows=apps.filter(a=>(String(a.name)+" "+String(a.subtitle)+" "+String(a.id)).toLowerCase().includes(q));return `<div class="pagehead"><div><h2>التطبيقات</h2><p>إضافة تطبيقات المتجر مع تحكم كامل بالظهور والربط.</p></div><button class="btn primary" id="addApp">+ إضافة تطبيق</button></div><div class="panel"><div class="toolbar"><input class="input" id="search" placeholder="بحث بالاسم أو ID..." value="${esc(state.search)}"><button class="btn secondary" id="enableAllApps">تفعيل الكل</button><button class="btn secondary" id="disableAllApps">إيقاف الكل</button></div>${rows.length?`<table class="table"><thead><tr><th>التطبيق</th><th>ID</th><th>الإصدار</th><th>الظهور</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${rows.map(a=>`<tr><td><div style="display:flex;gap:9px;align-items:center">${a.icon?`<img class="icon" src="${esc(a.icon)}">`:``}<div><b>${esc(a.name)}</b><div style="color:#8a8091;font-size:11px">${esc(a.subtitle)}</div></div></div></td><td><code>${esc(a.id)}</code></td><td>${esc(a.version)}</td><td>${a.showInHome===false?"الرئيسية: لا":"الرئيسية: نعم"}<br>${a.showInApps===false?"التطبيقات: لا":"التطبيقات: نعم"}</td><td><span class="badge ${a.enabled!==false?"on":"off"}">${a.enabled!==false?"مفعل":"متوقف"}</span></td><td><div class="actions"><button class="btn secondary small editApp" data-id="${esc(a.id)}">تعديل</button><button class="btn secondary small copyApp" data-id="${esc(a.id)}">نسخ ID</button><button class="btn danger small delApp" data-id="${esc(a.id)}">حذف</button></div></td></tr>`).join("")}</tbody></table>`:`<div class="empty">لا توجد نتائج.</div>`}</div>`}
function bannersPage(){const bs=[...(state.data["banners.json"]?.banners||[])].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));return `<div class="pagehead"><div><h2>البنرات</h2><p>اربط البنر بتطبيق تلقائياً واختر فتح أو انتقال أو رابط خارجي.</p></div><button class="btn primary" id="addBanner">+ إضافة بنر</button></div><div class="panel"><div class="noticebox" style="margin-bottom:14px">إذا اخترت <b>تطبيق</b> سيظهر لك كل تطبيقات لوحة التحكم بالاسم والـID، وبعد الحفظ يتم وضع <b>app_id</b> تلقائياً. نوع الإجراء: <b>فتح التطبيق</b> أو <b>انتقال لصفحة التطبيق</b> أو <b>رابط خارجي</b>. ونص الزر قابل للتخصيص.</div><div class="banner-list">${bs.length?bs.map(b=>{const app=(state.data["apps.json"]?.apps||[]).find(a=>a.id===b.app_id);return `<div class="banner"><img src="${esc(b.image_url||"")}" onerror="this.style.opacity=.25"><div><h4>${esc(b.title||"بدون عنوان")}</h4><p>${esc(b.description||b.subtitle||"")}</p><small>الترتيب: ${b.sort_order||0} • الإجراء: ${esc(actionName(b.action_type))} • التطبيق: ${esc(app?.name||b.app_id||"-")}</small><br><span class="badge ${b.enabled!==false?"on":"off"}">${b.enabled!==false?"مفعل":"متوقف"}</span></div><div class="actions"><button class="btn secondary small editBanner" data-id="${esc(b.id)}">تعديل</button><button class="btn danger small delBanner" data-id="${esc(b.id)}">حذف</button></div></div>`}).join(""):`<div class="empty">لا توجد بنرات.</div>`}</div></div>`}
function actionName(v){return ({none:"بدون",app_open:"فتح التطبيق",app_detail:"انتقال لصفحة التطبيق",external:"رابط خارجي"})[v]||v||"بدون"}
function sourcesPage(){const ss=state.data["sources.json"]?.sources||[];return `<div class="pagehead"><div><h2>المصادر</h2><p>إدارة مصادر repos.json.</p></div><button class="btn primary" id="addSource">+ إضافة مصدر</button></div><div class="panel">${ss.length?ss.map(s=>`<div class="source-card"><div><b>${esc(s.name)}</b><div><code>${esc(s.repo_url||"مصدر داخلي")}</code></div><span class="badge ${s.enabled!==false?"on":"off"}">${s.enabled!==false?"مفعل":"متوقف"}</span></div><div class="actions"><button class="btn secondary small editSource" data-id="${esc(s.id)}">تعديل</button><button class="btn danger small delSource" data-id="${esc(s.id)}">حذف</button></div></div>`).join(""):`<div class="empty">لا توجد مصادر.</div>`}</div>`}
function categoriesPage(){const cs=state.data["categories.json"]?.categories||[];return `<div class="pagehead"><div><h2>التصنيفات</h2><p>إدارة تصنيفات التطبيقات.</p></div><button class="btn primary" id="addCategory">+ إضافة تصنيف</button></div><div class="panel"><table class="table"><thead><tr><th>الاسم</th><th>English</th><th>ID</th><th>الحالة</th><th></th></tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(c.name_ar)}</td><td>${esc(c.name_en)}</td><td>${esc(c.id)}</td><td><span class="badge ${c.enabled!==false?"on":"off"}">${c.enabled!==false?"مفعل":"متوقف"}</span></td><td><div class="actions"><button class="btn secondary small editCat" data-id="${esc(c.id)}">تعديل</button><button class="btn danger small delCat" data-id="${esc(c.id)}">حذف</button></div></td></tr>`).join("")}</tbody></table></div>`}

function formatDate(v){if(!v)return "—";const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v);return d.toLocaleString("ar-IQ",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}
function localDateTime(v){if(!v)return "";const d=new Date(v);if(Number.isNaN(d.getTime()))return "";return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function durationExpiry(start,duration,type){const d=new Date(start||now()),n=Number(duration);if(!Number.isFinite(n)||n<=0)return "";if(type==="minutes")d.setMinutes(d.getMinutes()+n);else if(type==="hours")d.setHours(d.getHours()+n);else if(type==="days")d.setDate(d.getDate()+n);else if(type==="months")d.setMonth(d.getMonth()+n);else if(type==="years")d.setFullYear(d.getFullYear()+n);return d.toISOString()}
function vipStatus(a){if(a.enabled===false)return ["متوقف","off"];const e=a.expires_at?new Date(a.expires_at).getTime():NaN;if(Number.isFinite(e)&&Date.now()>=e)return ["منتهي","off"];if(a.device_lock===true&&a.device_id)return ["مرتبط بجهاز","gold"];return ["فعال","on"]}
function vipPage(){const accounts=state.data["vip.json"]?.accounts||[];return `<div class="pagehead"><div><h2>VIP المشتركين</h2><p>إضافة وتعديل وحذف المشتركين وإدارة المدة والجهاز المرتبط.</p></div><button class="btn primary" id="addVIP">+ إضافة مشترك</button></div><div class="panel"><div class="noticebox" style="margin-bottom:14px"><b>إدارة كاملة:</b> بيانات الدخول، اسم المشترك، مدة الاشتراك، التفعيل والانتهاء، الحالة، وربط جهاز واحد.</div>${accounts.length?`<table class="table"><thead><tr><th>المشترك</th><th>الدخول</th><th>المدة</th><th>التفعيل</th><th>الانتهاء</th><th>الجهاز</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${accounts.map(a=>{const [st,cl]=vipStatus(a);const units={minutes:"دقيقة",hours:"ساعة",days:"يوم",months:"شهر",years:"سنة"};const dur=a.duration?`${a.duration} ${units[a.duration_type]||a.duration_type||""}`:"—";return `<tr><td><b>${esc(a.display_name||a.name||a.username||"بدون اسم")}</b><div class="mini">${esc(a.id||"")}</div></td><td><code>${esc(a.username||"")}</code><br><span class="mini">كود: ${esc(a.code||"")}</span></td><td>${esc(dur)}</td><td>${esc(formatDate(a.start_at||a.activation_at||a.created_at))}</td><td>${esc(formatDate(a.expires_at))}</td><td><span class="badge ${a.device_lock&&a.device_id?"gold":"off"}">${a.device_lock&&a.device_id?"مرتبط":"غير مرتبط"}</span></td><td><span class="badge ${cl}">${st}</span></td><td><div class="actions"><button class="btn secondary small editVIP" data-id="${esc(a.id||a.username)}">تعديل</button><button class="btn secondary small copyVIP" data-id="${esc(a.id||a.username)}">نسخ البيانات</button><button class="btn secondary small duplicateVIP" data-id="${esc(a.id||a.username)}">نسخ المشترك</button><button class="btn secondary small resetVIP" data-id="${esc(a.id||a.username)}">فك الجهاز</button><button class="btn danger small delVIP" data-id="${esc(a.id||a.username)}">حذف</button></div></td></tr>`}).join("")}</tbody></table>`:`<div class="empty">لا يوجد مشتركون. اضغط «إضافة مشترك» للبدء.</div>`}</div>`}
function vipForm(a){const isNew=!a.id,idv=a.id||id("vip"),start=a.start_at||a.activation_at||a.created_at||now(),dt=a.duration_type||"days";return `<div class="noticebox" style="margin-bottom:14px"><b>حساب VIP:</b> الـID يولد تلقائياً. أدخل المدة وتاريخ البداية، ويمكن حساب الانتهاء تلقائياً.</div><div class="grid2">${field("ID المشترك — تلقائي","vId",idv)}${field("اسم المستخدم","vUsername",a.username||"","text","username")}${field("كلمة المرور","vPassword",a.password||"","text","كلمة المرور")}${field("كود الاشتراك","vCode",a.code||"","text","الكود")}${field("اسم المشترك","vDisplay",a.display_name||a.name||"","text","الاسم الظاهر")}${field("معرّف الشهادة","vCert",a.certificate_id||"","text","اختياري")}</div><div class="sectionline"></div><h3>مدة الاشتراك</h3><div class="grid3">${field("المدة","vDuration",a.duration??"","number","مثال: 30")}<div class="field"><label>نوع المدة</label><select id="vDurationType"><option value="minutes" ${dt==="minutes"?"selected":""}>دقائق</option><option value="hours" ${dt==="hours"?"selected":""}>ساعات</option><option value="days" ${dt==="days"?"selected":""}>أيام</option><option value="months" ${dt==="months"?"selected":""}>أشهر</option><option value="years" ${dt==="years"?"selected":""}>سنوات</option></select></div>${field("تاريخ البداية","vStart",localDateTime(start),"datetime-local")}</div><div class="grid2">${field("تاريخ الانتهاء — تلقائي/يدوي","vExpiry",localDateTime(a.expires_at),"datetime-local")}<div class="field"><label>حالة الاشتراك</label><select id="vEnabled"><option value="true" ${a.enabled!==false?"selected":""}>فعال</option><option value="false" ${a.enabled===false?"selected":""}>متوقف</option></select></div></div><div class="sectionline"></div><h3>ربط الجهاز</h3><div class="grid2">${field("Device ID","vDevice",a.device_id||"","text","اتركه فارغاً للربط عند أول تسجيل دخول")}<div><label class="check"><input id="vLock" type="checkbox" ${a.device_lock===true?"checked":""}> قفل الاشتراك على جهاز واحد</label><div class="help">أول جهاز يسجل الدخول يُربط بالحساب. يمكن فك الربط من قائمة المشتركين.</div></div></div><div class="sectionline"></div><div class="actions"><button class="btn primary" id="saveVIP">${isNew?"إضافة المشترك":"حفظ التعديلات"}</button><button class="btn secondary" id="calcVIP">احسب الانتهاء</button><button class="btn secondary" id="cancel">إلغاء</button></div>`}

function settingsPage(){const s=state.data["settings.json"]?.store||{};return `<div class="pagehead"><div><h2>الإعدادات</h2><p>إعدادات المتجر العامة.</p></div><button class="btn primary" id="saveSettings">حفظ الإعدادات</button></div><div class="panel"><div class="grid2"><div class="field"><label>اسم المتجر</label><input id="setName" class="input" value="${esc(s.name||"NOVA STORE")}"></div><div class="field"><label>قناة التحديثات</label><input id="setChannel" class="input" value="${esc(s.support_channel||"")}" placeholder="https://t.me/..."></div><div class="field"><label>عدد آخر التطبيقات</label><input id="setLimit" class="input" type="number" min="1" max="100" value="${s.latest_apps_limit||10}"></div><label class="check"><input id="setMaint" type="checkbox" ${s.maintenance?"checked":""}> وضع الصيانة</label></div></div>`}
function field(label,idName,value="",type="text",placeholder=""){return `<div class="field"><label>${label}</label><input class="input" id="${idName}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`}
function appForm(a){const cats=state.data["categories.json"]?.categories||[];const isNew=!a.id;const appID=a.id||id("app");return `<div class="noticebox" style="margin-bottom:14px"><b>معرّف التطبيق:</b> يتم توليده تلقائياً عند إنشاء التطبيق. لا تحتاج إلى اختراع ID بنفسك. استخدم زر نسخ ID إذا أردت ربطه بشيء خارج اللوحة.</div><div class="grid2">${field("اسم التطبيق","aName",a.name||"","text","اسم التطبيق")}${field("المعرّف ID — تلقائي","aId",appID)}${field("اسم المطور","aDeveloper",a.developer_name||"")}${field("الوصف المختصر","aSub",a.subtitle||"")}${field("الإصدار","aVer",a.version||"1.0.0")}${field("الحجم","aSize",a.size||"","text","مثال: 45 MB")}${field("الأيقونة URL","aIcon",a.icon||"","url","https://...")}${field("IPA URL","aIpa",a.ipa_url||"","url","https://...")}${field("URL Scheme لزر فتح","aScheme",a.url_scheme||"","text","مثال: telegram://")}${field("الوسم / الشارة","aBadge",a.badge||"","text","جديد / حصري / مميز")}${field("ترتيب التطبيق","aOrder",a.sort_order??0,"number")}${field("أقل إصدار iOS","aMinIOS",a.min_ios||"","text","16.4")}</div><div class="field"><label>التصنيف</label><select id="aCat"><option value="other">أخرى</option>${cats.map(c=>`<option value="${esc(c.id)}" ${c.id===(a.category_id||"other")?"selected":""}>${esc(c.name_ar)} (${esc(c.id)})</option>`).join("")}</select></div><div class="field"><label>الوسوم</label><input id="aTags" class="input" value="${esc((a.tags||[]).join(", "))}" placeholder="تليجرام, معدل, حصري"></div><div class="field"><label>الوصف</label><textarea id="aDesc" class="input textarea">${esc(a.description||"")}</textarea></div><div class="field"><label>صور التطبيق — رابط لكل صورة في سطر</label><textarea id="aScreens" class="input textarea" style="min-height:100px">${esc((a.screenshots||[]).join("\n"))}</textarea></div><div class="sectionline"></div><div class="grid2"><div><label class="check"><input id="aEnabled" type="checkbox" ${a.enabled!==false?"checked":""}> مفعل</label><label class="check"><input id="aFeatured" type="checkbox" ${a.featured?"checked":""}> مميز</label><label class="check"><input id="aExclusive" type="checkbox" ${a.exclusive!==false?"checked":""}> حصري للمتجر</label></div><div><label class="check"><input id="aHome" type="checkbox" ${a.show_in_home!==false?"checked":""}> يظهر في الرئيسية</label><label class="check"><input id="aApps" type="checkbox" ${a.show_in_apps!==false?"checked":""}> يظهر في التطبيقات</label></div></div><div class="actions"><button class="btn primary" id="saveApp">${isNew?"إضافة التطبيق":"حفظ التعديلات"}</button><button class="btn secondary" id="copyCurrentAppID">نسخ ID</button><button class="btn secondary" id="cancel">إلغاء</button></div>`}
function bannerForm(b){const apps=state.data["apps.json"]?.apps||[];const action=b.action_type||"none";const preset=b.button_title||"عرض";return `<div class="noticebox" style="margin-bottom:14px"><b>الربط صار سهل:</b> اختر التطبيق من القائمة بدل كتابة ID. إذا كان البنر لا يحتاج تطبيقاً اختر "بدون" أو "رابط خارجي".</div><div class="grid2">${field("عنوان البنر","bTitle",b.title||"")}${field("العنوان الفرعي","bSub",b.subtitle||"")}${field("صورة البنر URL","bImage",b.image_url||"","url","https://...")}${field("ترتيب البنر","bOrder",b.sort_order||1,"number")}</div><div class="field"><label>التطبيق المرتبط</label><select id="bApp"><option value="">بدون تطبيق</option>${apps.map(a=>`<option value="${esc(a.id)}" ${a.id===b.app_id?"selected":""}>${esc(a.name)} — ID: ${esc(a.id)} — ${esc(a.url_scheme||"بدون Scheme")}</option>`).join("")}</select><div class="help">اختيار التطبيق يحفظ app_id تلقائياً.</div></div><div class="grid2"><div class="field"><label>نوع الإجراء</label><select id="bAction"><option value="none" ${action==="none"?"selected":""}>بدون</option><option value="app_open" ${action==="app_open"?"selected":""}>فتح التطبيق</option><option value="app_detail" ${action==="app_detail"?"selected":""}>انتقال لصفحة التطبيق</option><option value="external" ${action==="external"?"selected":""}>رابط خارجي</option></select></div><div class="field"><label>نص الزر</label><select id="bPreset"><option value="عرض">عرض</option><option value="فتح">فتح</option><option value="انتقال">انتقال</option><option value="مشاهدة">مشاهدة</option><option value="تحميل">تحميل</option><option value="تثبيت">تثبيت</option><option value="المزيد">المزيد</option><option value="__custom__">مخصص...</option></select><input id="bButton" class="input" style="margin-top:7px" value="${esc(preset)}" placeholder="اكتب أي نص تريده"></div></div><div class="field"><label>رابط خارجي</label><input id="bUrl" class="input" type="url" value="${esc(b.external_url||"")}" placeholder="https://..."><div class="help">يُستخدم عندما يكون نوع الإجراء رابط خارجي.</div></div><div class="field"><label>الوصف</label><textarea id="bDesc" class="input textarea">${esc(b.description||"")}</textarea></div><div class="grid2"><label class="check"><input id="bEnabled" type="checkbox" ${b.enabled!==false?"checked":""}> البنر مفعل</label><label class="check"><input id="bShowButton" type="checkbox" ${b.show_button!==false?"checked":""}> إظهار زر الإجراء</label><label class="check"><input id="bOpenTap" type="checkbox" ${b.open_on_tap!==false?"checked":""}> الضغط على البنر ينفذ الإجراء</label></div><div class="field"><label>معاينة</label><img id="bPreview" class="preview" src="${esc(b.image_url||"")}" onerror="this.style.display='none'" onload="this.style.display='block'"></div><div class="actions"><button class="btn primary" id="saveBanner">حفظ البنر</button><button class="btn secondary" id="cancel">إلغاء</button></div>`}
function sourceForm(s){return `<div class="grid2">${field("اسم المصدر","sName",s.name||"")}${field("ID","sId",s.id||id("source"))}${field("رابط repos.json","sUrl",s.repo_url||"","url","https://example.com/repos.json")}</div><div class="field"><label>النوع</label><select id="sType"><option value="official" ${s.type==="official"?"selected":""}>رسمي</option><option value="external" ${s.type==="external"?"selected":""}>خارجي</option></select></div><label class="check"><input id="sEnabled" type="checkbox" ${s.enabled!==false?"checked":""}> مفعل</label><label class="check"><input id="sShow" type="checkbox" ${s.show_in_store!==false?"checked":""}> يظهر في المتجر</label><div class="actions"><button class="btn primary" id="saveSource">حفظ</button><button class="btn secondary" id="cancel">إلغاء</button></div>`}
function catForm(c){return `<div class="grid2">${field("الاسم العربي","cAr",c.name_ar||"")}${field("الاسم الإنكليزي","cEn",c.name_en||"")}${field("ID","cId",c.id||id("cat"))}${field("أيقونة SF Symbol","cIcon",c.icon||"square.grid.2x2.fill")}</div><label class="check"><input id="cEnabled" type="checkbox" ${c.enabled!==false?"checked":""}> مفعل</label><div class="actions"><button class="btn primary" id="saveCat">حفظ</button><button class="btn secondary" id="cancel">إلغاء</button></div>`}
function modalView(){let title="",body="";if(state.modal.type==="app"){const a=state.modal.item||{};title=a.id?"تعديل تطبيق":"إضافة تطبيق";body=appForm(a)}if(state.modal.type==="banner"){const b=state.modal.item||{};title=b.id?"تعديل بنر":"إضافة بنر";body=bannerForm(b)}if(state.modal.type==="source"){const s=state.modal.item||{};title=s.id?"تعديل مصدر":"إضافة مصدر";body=sourceForm(s)}if(state.modal.type==="category"){const c=state.modal.item||{};title=c.id?"تعديل تصنيف":"إضافة تصنيف";body=catForm(c)}if(state.modal.type==="vip"){const a=state.modal.item||{};title=a.id?"تعديل مشترك VIP":"إضافة مشترك VIP";body=vipForm(a)}return `<div class="modal"><section class="modalbox"><div class="modalhead"><h3>${title}</h3><button class="btn secondary" id="closeModal">إغلاق</button></div>${body}</section></div>`}
function val(idName){return $("#"+idName)?.value?.trim()||""}
function currentItem(type){const map={app:["apps.json","apps"],banner:["banners.json","banners"],source:["sources.json","sources"],category:["categories.json","categories"],vip:["vip.json","accounts"]};const [f,k]=map[type];return {f,k,arr:state.data[f][k]||[]}}
function openModal(type,item={}){state.modal={type,item};render()}
function closeModal(){state.modal=null;render()}
async function commit(type,item){const {f,k,arr}=currentItem(type),idx=arr.findIndex(x=>x.id===item.id);if(idx>=0)arr[idx]=item;else arr.push(item);state.data[f][k]=arr;state.modal=null;render();await saveFiles([f],`Manage ${type} in NOVA STORE`)}
function render(){document.getElementById("root").innerHTML=state.token?shell():loginView();bind()}
function bind(){
 $("#show")?.addEventListener("click",()=>{const x=$("#token");x.type=x.type==="password"?"text":"password";$("#show").textContent=x.type==="password"?"إظهار":"إخفاء"});
 $("#login")?.addEventListener("click",async()=>{const t=$("#token").value.trim();if(!t)return notify("الصق التوكن أولاً.");state.token=t;state.busy=true;render();try{await api("/user");localStorage.setItem("nova_token",t);await loadAll();notify("تم الاتصال بـ GitHub.")}catch(e){state.token="";state.busy=false;notify("فشل الاتصال: "+e.message)}});
 $("#logout")?.addEventListener("click",()=>{localStorage.removeItem("nova_token");state.token="";state.data={};render()});
 document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.search="";render()});
 $("#refresh")?.addEventListener("click",loadAll);$("#search")?.addEventListener("input",e=>{state.search=e.target.value;render();$("#search")?.focus()});
 $("#addApp")?.addEventListener("click",()=>openModal("app"));document.querySelectorAll(".editApp").forEach(b=>b.onclick=()=>openModal("app",(state.data["apps.json"].apps||[]).find(x=>x.id===b.dataset.id)));document.querySelectorAll(".delApp").forEach(b=>b.onclick=()=>del("apps.json","apps",b.dataset.id));
 $("#enableAllApps")?.addEventListener("click",()=>bulkApps(true));$("#disableAllApps")?.addEventListener("click",()=>bulkApps(false));
 $("#addBanner")?.addEventListener("click",()=>openModal("banner"));document.querySelectorAll(".editBanner").forEach(b=>b.onclick=()=>openModal("banner",(state.data["banners.json"].banners||[]).find(x=>x.id===b.dataset.id)));document.querySelectorAll(".delBanner").forEach(b=>b.onclick=()=>del("banners.json","banners",b.dataset.id));
 $("#addSource")?.addEventListener("click",()=>openModal("source"));document.querySelectorAll(".editSource").forEach(b=>b.onclick=()=>openModal("source",(state.data["sources.json"].sources||[]).find(x=>x.id===b.dataset.id)));document.querySelectorAll(".delSource").forEach(b=>b.onclick=()=>del("sources.json","sources",b.dataset.id));
 $("#addCategory")?.addEventListener("click",()=>openModal("category"));document.querySelectorAll(".editCat").forEach(b=>b.onclick=()=>openModal("category",(state.data["categories.json"].categories||[]).find(x=>x.id===b.dataset.id)));document.querySelectorAll(".delCat").forEach(b=>b.onclick=()=>del("categories.json","categories",b.dataset.id));
 $("#addVIP")?.addEventListener("click",()=>openModal("vip"));
 document.querySelectorAll(".editVIP").forEach(b=>b.onclick=()=>{const item=(state.data["vip.json"]?.accounts||[]).find(x=>String(x.id||x.username)===b.dataset.id);if(item)openModal("vip",item)});
 document.querySelectorAll(".copyVIP").forEach(b=>b.onclick=async()=>{const item=(state.data["vip.json"]?.accounts||[]).find(x=>String(x.id||x.username)===b.dataset.id);if(!item)return;const text=`اسم المستخدم: ${item.username||""}\nكلمة المرور: ${item.password||""}\nكود الاشتراك: ${item.code||""}`;try{await navigator.clipboard.writeText(text);notify("تم نسخ بيانات المشترك.")}catch{notify("تعذر النسخ من هذا المتصفح.")}});
 document.querySelectorAll(".duplicateVIP").forEach(b=>b.onclick=()=>{const item=(state.data["vip.json"]?.accounts||[]).find(x=>String(x.id||x.username)===b.dataset.id);if(!item)return;openModal("vip",{...structuredClone(item),id:id("vip"),username:"",password:"",code:"",device_id:"",device_lock:false,created_at:now(),updated_at:now()})});
 document.querySelectorAll(".resetVIP").forEach(b=>b.onclick=async()=>{const item=(state.data["vip.json"]?.accounts||[]).find(x=>String(x.id||x.username)===b.dataset.id);if(!item)return;if(!confirm("فك ربط الجهاز لهذا المشترك؟"))return;item.device_id="";item.device_lock=false;item.updated_at=now();await commit("vip",item);notify("تم فك ربط الجهاز.")});
 document.querySelectorAll(".delVIP").forEach(b=>b.onclick=()=>del("vip.json","accounts",b.dataset.id));
 $("#closeModal")?.addEventListener("click",closeModal);$("#cancel")?.addEventListener("click",closeModal);
 $("#copyCurrentAppID")?.addEventListener("click",()=>navigator.clipboard?.writeText(val("aId")));$("#copyCurrentAppID")?.addEventListener("click",()=>notify("تم نسخ ID التطبيق."));
 $("#calcVIP")?.addEventListener("click",()=>{const start=val("vStart")?new Date(val("vStart")).toISOString():now();const expiry=durationExpiry(start,val("vDuration"),$("#vDurationType")?.value||"days");if(!expiry)return notify("أدخل مدة صحيحة أولاً.");$("#vExpiry").value=localDateTime(expiry);notify("تم حساب تاريخ الانتهاء.")});
 $("#saveVIP")?.addEventListener("click",async()=>{const old=state.modal?.item||{},username=val("vUsername"),password=val("vPassword"),code=val("vCode");if(!username||!password||!code)return notify("أدخل اسم المستخدم وكلمة المرور وكود الاشتراك.");const startRaw=val("vStart"),start=startRaw?new Date(startRaw).toISOString():(old.start_at||old.activation_at||now());let expiry=val("vExpiry");if(!expiry&&val("vDuration"))expiry=durationExpiry(start,val("vDuration"),$("#vDurationType")?.value||"days");if(!expiry)return notify("حدد مدة الاشتراك أو تاريخ الانتهاء.");const item={id:val("vId")||id("vip"),username,password,code,display_name:val("vDisplay"),certificate_id:val("vCert"),duration:Number(val("vDuration"))||0,duration_type:$("#vDurationType")?.value||"days",start_at:start,activation_at:start,expires_at:new Date(expiry).toISOString(),enabled:$("#vEnabled")?.value!=="false",device_id:val("vDevice"),device_lock:$("#vLock")?.checked===true,created_at:old.created_at||now(),updated_at:now()};const duplicate=(state.data["vip.json"]?.accounts||[]).some(x=>String(x.username).toLowerCase()===username.toLowerCase()&&String(x.id)!==String(item.id));if(duplicate)return notify("اسم المستخدم مستخدم بالفعل.");await commit("vip",item);notify("تم حفظ مشترك VIP بنجاح.")});
 $("#saveApp")?.addEventListener("click",()=>{const old=state.modal.item||{},newID=val("aId")||id("app");commit("app",{id:newID,name:val("aName"),developer_name:val("aDeveloper"),subtitle:val("aSub"),description:val("aDesc"),icon:val("aIcon"),version:val("aVer"),size:val("aSize"),category_id:val("aCat")||"other",source_id:val("aSource")||"nova-store",source_type:"official",ipa_url:val("aIpa"),url_scheme:val("aScheme"),badge:val("aBadge"),tags:val("aTags").split(",").map(x=>x.trim()).filter(Boolean),sort_order:Number(val("aOrder"))||0,min_ios:val("aMinIOS"),screenshots:val("aScreens").split(/\n+/).map(x=>x.trim()).filter(Boolean),featured:$("#aFeatured").checked,exclusive:$("#aExclusive").checked,show_in_home:$("#aHome").checked,show_in_apps:$("#aApps").checked,enabled:$("#aEnabled").checked,created_at:old.created_at||now(),updated_at:now()})});
 $("#bImage")?.addEventListener("input",()=>{const p=$("#bPreview");p.src=val("bImage");p.style.display="block"});$("#bPreset")?.addEventListener("change",e=>{if(e.target.value!=="__custom__")$("#bButton").value=e.target.value});
 $("#saveBanner")?.addEventListener("click",()=>commit("banner",{id:state.modal.item.id||id("banner"),image_url:val("bImage"),title:val("bTitle"),subtitle:val("bSub"),description:val("bDesc"),action_type:val("bAction"),app_id:val("bApp")||null,external_url:val("bUrl"),button_title:val("bButton")||"عرض",sort_order:Number(val("bOrder"))||1,enabled:$("#bEnabled").checked,show_button:$("#bShowButton").checked,open_on_tap:$("#bOpenTap").checked}));
 $("#saveSource")?.addEventListener("click",()=>commit("source",{id:val("sId"),name:val("sName"),repo_url:val("sUrl"),type:val("sType"),enabled:$("#sEnabled").checked,show_in_store:$("#sShow").checked}));
 $("#saveCat")?.addEventListener("click",()=>commit("category",{id:val("cId"),name_ar:val("cAr"),name_en:val("cEn"),icon:val("cIcon"),enabled:$("#cEnabled").checked}));
 $("#saveSettings")?.addEventListener("click",async()=>{state.data["settings.json"].store={...state.data["settings.json"].store,name:val("setName"),support_channel:val("setChannel"),latest_apps_limit:Number(val("setLimit"))||10,maintenance:$("#setMaint").checked};await saveFiles(["settings.json"],"Update NOVA STORE settings")});
}
async function bulkApps(enabled){const apps=state.data["apps.json"]?.apps||[];state.data["apps.json"].apps=apps.map(a=>({...a,enabled,updated_at:now()}));await saveFiles(["apps.json"],enabled?"Enable all NOVA apps":"Disable all NOVA apps")}
async function del(file,key,which){if(!confirm("متأكد تريد حذف هذا العنصر؟"))return;state.data[file][key]=(state.data[file][key]||[]).filter(x=>x.id!==which);await saveFiles([file],"Delete item from NOVA STORE")}
render();
</script>
</body>
</html>
